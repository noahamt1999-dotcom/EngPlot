name: Build EngPlot for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Check application files
        shell: pwsh
        run: |
          if (!(Test-Path "main.py")) {
            throw "main.py is missing from the repository"
          }

      - name: Build EngPlot
        run: pyinstaller --noconfirm --windowed --onedir --name EngPlot main.py

      - name: Package application
        run: Compress-Archive -Path dist/EngPlot -DestinationPath EngPlot-Windows.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: EngPlot-Windows
          path: EngPlot-Windows.zip
          if-no-files-found: error
