name: Build EngPlot for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check application source
        shell: pwsh
        run: |
          if (!(Test-Path "main.py")) {
            throw "File main.py was not found"
          }

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name EngPlot main.py

      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path dist/EngPlot -DestinationPath EngPlot-Windows.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: EngPlot-Windows
          path: EngPlot-Windows.zip
          if-no-files-found: error
          retention-days: 14
